<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--onl-bg)">
  <div class="onl-card onl-card--pad-lg" style="width:100%;max-width:400px">
    <div style="text-align:center">
      <span class="onl-icon-tile onl-icon-tile--lg"><svg data-icon="users"></svg></span>
      <h1 class="onl-h2" style="margin-top:14px">Welcome back</h1>
      <p class="onl-text-muted" style="margin-top:4px">Sign in to Green Valley School</p>
    </div>
    <form class="onl-stack" style="margin-top:24px;--onl-gap:14px">
      <div class="onl-field"><label class="onl-label" for="lg-email">Email or phone</label><input class="onl-input" id="lg-email" autocomplete="username" placeholder="you@school.in"></div>
      <div class="onl-field"><label class="onl-label" for="lg-pass">Password</label><input class="onl-input" id="lg-pass" type="password" autocomplete="current-password"><a href="#" class="onl-text-xs" style="align-self:flex-end">Forgot password?</a></div>
      <label class="onl-check"><input type="checkbox" checked> Keep me signed in</label>
      <button class="onl-btn onl-btn--brand onl-btn--lg onl-btn--block" type="submit">Sign in</button>
    </form>
    <div class="onl-row onl-row--nowrap" style="--onl-gap:12px;margin:20px 0" aria-hidden="true"><hr class="onl-divider onl-grow" style="margin:0"><span class="onl-text-xs onl-text-muted">or</span><hr class="onl-divider onl-grow" style="margin:0"></div>
    <button class="onl-btn onl-btn--block" type="button">Sign in with a one-time code</button>
    <p class="onl-text-sm onl-text-muted" style="text-align:center;margin-top:20px">New parent? <a href="#">Activate your account</a></p>
  </div>
</div>
