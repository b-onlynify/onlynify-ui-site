<section class="onl-section">
  <div class="onl-container">
    <div class="onl-card onl-card--gradient-border" style="display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));align-items:center;padding:clamp(24px,4vw,48px)">
      <div>
        <span class="onl-announce"><b>Weekly</b> 12,400 designers read it</span>
        <h2 class="onl-h1" style="font-size:2rem;margin-top:14px;letter-spacing:-0.03em">Product notes, every Friday</h2>
        <p class="onl-text-muted" style="margin-top:8px">One short email with what we shipped, what we learned and the best interface we saw this week.</p>
      </div>
      <form class="onl-stack" style="--onl-gap:10px">
        <div class="onl-row onl-row--nowrap" style="--onl-gap:8px"><input class="onl-input onl-input--lg" type="email" placeholder="you@company.com" aria-label="Email" autocomplete="email"><button class="onl-btn onl-btn--brand onl-btn--lg" type="submit">Subscribe</button></div>
        <div class="onl-row" style="--onl-gap:8px"><span class="onl-avatar-group"><span class="onl-avatar onl-avatar--sm" style="--hue:20">AK</span><span class="onl-avatar onl-avatar--sm" style="--hue:200">RS</span><span class="onl-avatar onl-avatar--sm" style="--hue:300">MP</span></span><span class="onl-text-xs onl-text-muted">No spam. Unsubscribe with one click.</span></div>
      </form>
    </div>
  </div>
</section>
