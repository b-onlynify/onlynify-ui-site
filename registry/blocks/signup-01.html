<div class="onl-bg-mesh" style="min-height:100vh;display:grid;place-items:center;padding:32px 16px">
  <div class="onl-card onl-card--pad-lg" style="width:100%;max-width:440px">
    <div style="text-align:center">
      <span class="onl-feature__icon" style="margin-inline:auto"><svg data-icon="layers"></svg></span>
      <h1 class="onl-h2" style="margin-top:14px">Create your account</h1>
      <p class="onl-text-muted" style="margin-top:4px">Start your 14-day free trial. No card needed.</p>
    </div>
    <form class="onl-stack" style="margin-top:24px;--onl-gap:14px">
      <div class="onl-field"><label class="onl-label" for="su-name">Full name</label><input class="onl-input" id="su-name" autocomplete="name" placeholder="Asha Menon"></div>
      <div class="onl-field"><label class="onl-label" for="su-email">Work email</label><input class="onl-input" id="su-email" type="email" autocomplete="email" placeholder="asha@company.com"></div>
      <div class="onl-field"><label class="onl-label" for="su-pass">Password</label><input class="onl-input" id="su-pass" type="password" autocomplete="new-password" data-onl-strength="#su-meter"><div class="onl-strength" id="su-meter" data-score="0"><i></i><i></i><i></i><i></i><span class="onl-strength__label"></span></div><p class="onl-help">12+ characters with a mix of letters, numbers and symbols.</p></div>
      <label class="onl-check"><input type="checkbox"><span class="onl-check__text">I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></span></label>
      <button class="onl-btn onl-btn--gradient onl-btn--lg onl-btn--block" type="submit">Create account</button>
    </form>
    <p class="onl-divider--label" style="margin:22px 0">Verify your phone</p>
    <div class="onl-stack" style="--onl-gap:10px;align-items:center">
      <div class="onl-otp" data-onl-otp aria-label="Verification code"><input inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder=" " aria-label="Digit 1"><input inputmode="numeric" maxlength="1" placeholder=" " aria-label="Digit 2"><input inputmode="numeric" maxlength="1" placeholder=" " aria-label="Digit 3"><input inputmode="numeric" maxlength="1" placeholder=" " aria-label="Digit 4"><input inputmode="numeric" maxlength="1" placeholder=" " aria-label="Digit 5"><input inputmode="numeric" maxlength="1" placeholder=" " aria-label="Digit 6"></div>
      <p class="onl-text-xs onl-text-muted">Code sent to +91 98••• ••210 · <a href="#">Resend in 0:28</a></p>
    </div>
    <p class="onl-text-sm onl-text-muted" style="text-align:center;margin-top:20px">Already have an account? <a href="#">Sign in</a></p>
  </div>
</div>
