<div class="onlp-stage onlp-stage--mesh">
  <div class="onlp-grid onlp-max" style="--onlp-min:320px;--onlp-max:900px;--onlp-gap:20px;align-items:start">
    <div class="onlp-card onlp-card--pad onlp-stack" style="--onlp-gap:18px;text-align:center;padding:28px">
      <span class="onlp-tile onlp-tile--solid" style="margin-inline:auto;width:52px;height:52px;border-radius:16px"><svg data-icon="shield-check"></svg></span>
      <div><h3 class="onlp-title" style="font-size:20px">Check your phone</h3><p class="onlp-sub" style="margin-top:4px">We sent a 6-digit code to <b style="color:var(--onl-fg)">+91 86866 •••72</b></p></div>
      <div class="onlp-otp" data-onl-otp aria-label="Verification code">
        <input inputmode="numeric" maxlength="1" placeholder=" " value="4" aria-label="Digit 1">
        <input inputmode="numeric" maxlength="1" placeholder=" " value="8" aria-label="Digit 2">
        <input inputmode="numeric" maxlength="1" placeholder=" " value="2" aria-label="Digit 3">
        <i></i>
        <input inputmode="numeric" maxlength="1" placeholder=" " aria-label="Digit 4">
        <input inputmode="numeric" maxlength="1" placeholder=" " aria-label="Digit 5">
        <input inputmode="numeric" maxlength="1" placeholder=" " aria-label="Digit 6">
      </div>
      <button type="button" class="onlp-btn onlp-btn--gradient onlp-btn--lg" style="width:100%">Verify and continue</button>
      <p class="onlp-sub">Didn't get it? <b style="color:var(--onl-fg)">Resend in 0:24</b> · <a href="#">Use email instead</a></p>
    </div>
    <div class="onlp-card onlp-card--pad onlp-stack" style="--onlp-gap:16px;padding:28px">
      <div><h3 class="onlp-title" style="font-size:20px">Create a password</h3><p class="onlp-sub" style="margin-top:4px">Use it to sign in on new devices.</p></div>
      <div class="onlp-field">
        <label class="onlp-label" for="pw-new2">New password</label>
        <div class="onlp-control"><svg data-icon="lock"></svg><input class="onlp-input" id="pw-new2" type="password" value="Sunrise2026" autocomplete="new-password"><span class="onlp-control__end"><button type="button" class="onlp-x" style="width:28px;height:28px" aria-label="Show password"><svg data-icon="eye"></svg></button></span></div>
        <div class="onlp-meter4" data-score="3" aria-label="Strength: good"><i></i><i></i><i></i><i></i></div>
        <p class="onlp-hint" style="justify-content:space-between"><span>Strength</span><b style="color:var(--onl-series-1)">Good</b></p>
      </div>
      <ul class="onlp-checklist">
        <li data-ok>8+ characters</li>
        <li data-ok>Upper &amp; lower case</li>
        <li data-ok>A number</li>
        <li>A symbol (!@#…)</li>
      </ul>
      <div class="onlp-field">
        <label class="onlp-label" for="pw-confirm2">Confirm password</label>
        <div class="onlp-control"><svg data-icon="lock"></svg><input class="onlp-input" id="pw-confirm2" type="password" value="Sunrise2026" data-valid><span class="onlp-control__end" style="color:var(--onl-success)"><svg data-icon="check-circle"></svg></span></div>
        <p class="onlp-hint onlp-hint--ok"><svg data-icon="check"></svg>Passwords match</p>
      </div>
      <button type="button" class="onlp-btn onlp-btn--dark" style="width:100%">Save password</button>
    </div>
  </div>
</div>
