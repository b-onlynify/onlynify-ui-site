<div class="onlp-stage onlp-stage--mesh">
  <div class="onlp-card onlp-auth onlp-max" style="--onlp-max:1000px">
    <aside class="onlp-auth__art">
      <div class="onlp-logo" style="color:#fff"><i style="background:rgb(255 255 255 / 0.2);box-shadow:none">S</i>Sunrise Books</div>
      <div class="onlp-stack" style="--onlp-gap:18px;position:relative;z-index:1">
        <blockquote>“We closed the month in two days instead of nine. The team actually enjoys doing the books now.”</blockquote>
        <div class="onlp-person"><span class="onlp-av" style="--hue:28;box-shadow:0 0 0 3px rgb(255 255 255 / 0.35)">MK</span><div><b>Meera Krishnan</b><small>Finance lead, Coastline Foods</small></div></div>
        <div class="onlp-row" style="--onlp-gap:6px"><span class="onlp-stars" style="color:#ffd166">★★★★★</span><span style="font-size:13px;opacity:0.85">4.9 from 2,300+ teams</span></div>
      </div>
    </aside>
    <form class="onlp-auth__form" action="#" aria-labelledby="pa-title">
      <div class="onlp-stack" style="--onlp-gap:6px">
        <h2 id="pa-title">Welcome back</h2>
        <p class="onlp-sub">New here? <a class="onlp-link" href="#">Create an account</a></p>
      </div>
      <div class="onlp-sso">
        <button type="button" class="onlp-btn onlp-btn--outline"><svg data-icon="key"></svg>Single sign-on</button>
        <button type="button" class="onlp-btn onlp-btn--outline"><svg data-icon="smartphone"></svg>Phone OTP</button>
      </div>
      <div class="onlp-or">or with email</div>
      <div class="onlp-field">
        <label class="onlp-label" for="pa-email">Work email</label>
        <div class="onlp-control"><svg data-icon="mail"></svg><input id="pa-email" class="onlp-input" type="email" value="riya@sunrise.in" autocomplete="email" data-valid><span class="onlp-control__end" style="color:var(--onl-success)"><svg data-icon="check-circle"></svg></span></div>
      </div>
      <div class="onlp-field">
        <label class="onlp-label" for="pa-pass">Password <a class="onlp-link onlp-xs" href="#">Forgot?</a></label>
        <div class="onlp-control"><svg data-icon="lock"></svg><input id="pa-pass" class="onlp-input" type="password" value="sunrise-2026" autocomplete="current-password"><span class="onlp-control__end"><svg data-icon="eye"></svg></span></div>
      </div>
      <label class="onlp-row" style="--onlp-gap:8px;font-size:13px;color:var(--onl-muted)"><input class="onlp-check" type="checkbox" checked>Keep me signed in for 30 days</label>
      <button type="submit" class="onlp-btn onlp-btn--gradient onlp-btn--lg onlp-btn--shine">Sign in<svg data-icon="arrow-right"></svg></button>
      <p class="onlp-hint" style="justify-content:center"><svg data-icon="shield-check"></svg>Protected with two-step verification</p>
    </form>
  </div>
</div>
