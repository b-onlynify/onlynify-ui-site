<div class="onlp-stage">
  <div class="onlp-grid onlp-max" style="--onlp-min:300px;--onlp-max:960px">
    <div class="onlp-card onlp-card--pad onlp-stack" style="--onlp-gap:16px">
      <p class="onlp-kicker">Badges</p>
      <div class="onlp-row" style="--onlp-gap:8px">
        <span class="onlp-badge onlp-badge--gradient"><svg data-icon="crown"></svg>Pro</span>
        <span class="onlp-badge onlp-badge--brand">Beta</span>
        <span class="onlp-badge onlp-badge--success"><svg data-icon="check"></svg>Paid</span>
        <span class="onlp-badge onlp-badge--warning">Pending</span>
        <span class="onlp-badge onlp-badge--danger">Overdue</span>
        <span class="onlp-badge"><svg data-icon="tag"></svg>Design</span>
      </div>
      <span class="onlp-badge onlp-badge--new" style="width:fit-content"><b>New</b>Reports now export to Excel<svg data-icon="arrow-right"></svg></span>
      <div class="onlp-row" style="--onlp-gap:16px">
        <span class="onlp-delta onlp-delta--up">12.4%</span>
        <span class="onlp-delta onlp-delta--down">3.1%</span>
        <span class="onlp-row" style="--onlp-gap:6px"><svg data-icon="bell" style="width:18px;height:18px"></svg><span class="onlp-count">12</span></span>
      </div>
    </div>
    <div class="onlp-card onlp-card--pad onlp-stack" style="--onlp-gap:16px">
      <p class="onlp-kicker">Live status</p>
      <div class="onlp-stack" style="--onlp-gap:10px">
        <div class="onlp-row onlp-row--between"><span class="onlp-sub">API</span><span class="onlp-status onlp-status--live">Operational</span></div>
        <div class="onlp-row onlp-row--between"><span class="onlp-sub">Payments</span><span class="onlp-status onlp-status--warn">Degraded</span></div>
        <div class="onlp-row onlp-row--between"><span class="onlp-sub">SMS gateway</span><span class="onlp-status onlp-status--down">Outage</span></div>
        <div class="onlp-row onlp-row--between"><span class="onlp-sub">Backups</span><span class="onlp-status onlp-status--info">Scheduled 02:00</span></div>
      </div>
    </div>
    <div class="onlp-card onlp-card--pad onlp-stack" style="--onlp-gap:16px">
      <p class="onlp-kicker">Avatars</p>
      <div class="onlp-row" style="--onlp-gap:14px">
        <span class="onlp-av onlp-av--xl onlp-av--ring" style="--hue:220">AK</span>
        <span class="onlp-av onlp-av--lg" style="--hue:12" data-presence="online">RS</span>
        <span class="onlp-av" style="--hue:150" data-presence="away">VM</span>
        <span class="onlp-av onlp-av--sm onlp-av--square" style="--hue:280" data-presence="busy">PN</span>
      </div>
      <div class="onlp-row onlp-row--between">
        <div class="onlp-avs">
          <span class="onlp-av onlp-av--sm" style="--hue:12" title="Riya Shah">RS</span>
          <span class="onlp-av onlp-av--sm" style="--hue:210" title="Vikram Kumar">VK</span>
          <span class="onlp-av onlp-av--sm" style="--hue:140" title="Sana Mirza">SM</span>
          <span class="onlp-av onlp-av--sm" style="--hue:320" title="Arjun Rao">AR</span>
          <span class="onlp-av onlp-av--sm onlp-av--more">+8</span>
        </div>
        <span class="onlp-sub">12 collaborators</span>
      </div>
      <div class="onlp-person"><span class="onlp-av" style="--hue:200" data-presence="online">MN</span><div><b>Meera Nair</b><small>Product designer · Bengaluru</small></div></div>
    </div>
  </div>
</div>
