<div class="onlp-stage onlp-stage--mesh">
  <div class="onlp-stack onlp-max" style="--onlp-gap:22px;--onlp-max:860px">
    <div class="onlp-card onlp-card--pad onlp-stack" style="--onlp-gap:14px">
      <p class="onlp-kicker">Primary actions</p>
      <div class="onlp-row">
        <button class="onlp-btn onlp-btn--gradient onlp-btn--shine"><svg data-icon="sparkles"></svg>Start free trial</button>
        <button class="onlp-btn onlp-btn--dark">Deploy now<span class="onlp-btn__kbd">⌘ ↵</span></button>
        <button class="onlp-btn onlp-btn--outline"><svg data-icon="download"></svg>Export</button>
        <button class="onlp-btn onlp-btn--soft"><svg data-icon="plus"></svg>Add member</button>
        <button class="onlp-btn onlp-btn--danger"><svg data-icon="trash"></svg>Delete</button>
      </div>
    </div>
    <div class="onlp-grid" style="--onlp-min:250px">
      <div class="onlp-card onlp-card--pad onlp-stack">
        <p class="onlp-kicker">Sizes & shapes</p>
        <div class="onlp-row">
          <button class="onlp-btn onlp-btn--gradient onlp-btn--sm onlp-btn--pill">Small</button>
          <button class="onlp-btn onlp-btn--gradient onlp-btn--pill">Default</button>
          <button class="onlp-btn onlp-btn--gradient onlp-btn--lg onlp-btn--pill">Large</button>
        </div>
        <div class="onlp-row">
          <button class="onlp-btn onlp-btn--outline onlp-btn--icon" aria-label="Edit"><svg data-icon="edit"></svg></button>
          <button class="onlp-btn onlp-btn--ring onlp-btn--icon onlp-btn--pill" aria-label="Like"><svg data-icon="heart"></svg></button>
          <button class="onlp-btn onlp-btn--soft onlp-btn--icon" aria-label="Share"><svg data-icon="share"></svg></button>
          <button class="onlp-btn onlp-btn--dark onlp-btn--icon onlp-btn--pill" aria-label="Settings"><svg data-icon="settings"></svg></button>
        </div>
      </div>
      <div class="onlp-card onlp-card--pad onlp-stack">
        <p class="onlp-kicker">States</p>
        <div class="onlp-row">
          <button class="onlp-btn onlp-btn--gradient" aria-busy="true" aria-label="Saving"><span class="onlp-dots"><i></i><i></i><i></i></span></button>
          <button class="onlp-btn onlp-btn--outline" aria-busy="true"><span class="onlp-spin" style="width:16px;height:16px"></span>Syncing</button>
        </div>
        <div class="onlp-split">
          <button class="onlp-btn onlp-btn--gradient">Publish</button>
          <button class="onlp-btn onlp-btn--gradient" aria-label="More publish options"><svg data-icon="chevron-down"></svg></button>
        </div>
      </div>
      <div class="onlp-card onlp-card--pad onlp-stack">
        <p class="onlp-kicker">Get the app</p>
        <div class="onlp-row">
          <a class="onlp-store" href="#"><svg data-icon="smartphone"></svg><span><small>Download on the</small><b>App Store</b></span></a>
          <a class="onlp-store" href="#"><svg data-icon="play"></svg><span><small>Get it on</small><b>Play Store</b></span></a>
        </div>
      </div>
    </div>
  </div>
</div>
