<div class="onlp-stage">
  <div class="onlp-grid onlp-max" style="--onlp-min:320px;--onlp-max:960px;--onlp-gap:20px">
    <div class="onlp-card onlp-empty">
      <span class="onlp-empty__art"><svg data-icon="inbox"></svg></span>
      <h3>No invoices yet</h3>
      <p>Create your first invoice or import past ones from a spreadsheet. Customers can pay online from the link.</p>
      <div class="onlp-row" style="justify-content:center;margin-top:10px;--onlp-gap:8px"><button type="button" class="onlp-btn onlp-btn--gradient onlp-btn--sm"><svg data-icon="plus"></svg>New invoice</button><button type="button" class="onlp-btn onlp-btn--outline onlp-btn--sm"><svg data-icon="upload"></svg>Import</button></div>
      <a class="onlp-sub onlp-xs" href="#" style="margin-top:6px">Watch a 2-minute tour</a>
    </div>
    <div class="onlp-card onlp-card--pad onlp-stack" style="--onlp-gap:18px" aria-busy="true" aria-label="Loading feed">
      <div class="onlp-row onlp-row--between"><div class="onlp-row" style="--onlp-gap:10px"><span class="onlp-spin"></span><b class="onlp-title">Loading activity…</b></div><span class="onlp-sub onlp-xs">Syncing 3 sources</span></div>
      <div class="onlp-row" style="--onlp-gap:12px"><span class="onlp-skel" style="width:40px;height:40px;border-radius:50%"></span><div class="onlp-stack onlp-grow" style="--onlp-gap:8px"><span class="onlp-skel" style="height:12px;width:60%"></span><span class="onlp-skel" style="height:10px;width:35%"></span></div></div>
      <span class="onlp-skel" style="height:120px;border-radius:12px"></span>
      <div class="onlp-row" style="--onlp-gap:12px"><span class="onlp-skel" style="width:40px;height:40px;border-radius:50%"></span><div class="onlp-stack onlp-grow" style="--onlp-gap:8px"><span class="onlp-skel" style="height:12px;width:72%"></span><span class="onlp-skel" style="height:10px;width:28%"></span></div></div>
      <div class="onlp-row" style="--onlp-gap:8px"><span class="onlp-skel" style="height:28px;width:80px;border-radius:99px"></span><span class="onlp-skel" style="height:28px;width:64px;border-radius:99px"></span></div>
    </div>
    <div class="onlp-card onlp-empty" style="grid-column:1/-1;flex-direction:row;text-align:start;gap:18px;padding:22px">
      <span class="onlp-empty__art" style="width:64px;height:64px;margin:0 8px;border-radius:20px"><svg data-icon="search" style="width:26px;height:26px"></svg></span>
      <div class="onlp-grow"><h3>No results for “kaveri foodz”</h3><p style="max-width:none">Try <a href="#">Kaveri Foods</a>, check the spelling or clear filters.</p></div>
      <button type="button" class="onlp-btn onlp-btn--outline onlp-btn--sm">Clear filters</button>
    </div>
  </div>
</div>
