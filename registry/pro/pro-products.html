<div class="onlp-stage">
  <div class="onlp-max onlp-stack" style="--onlp-max:1080px;--onlp-gap:16px">
    <div class="onlp-row onlp-row--between">
      <div><p class="onlp-kicker">New season</p><h2 style="font-size:22px;font-weight:700;letter-spacing:-0.02em">Home &amp; desk essentials</h2></div>
      <div class="onlp-row" style="--onlp-gap:8px">
        <button type="button" class="onlp-filter" data-active><svg data-icon="tag"></svg>On sale</button>
        <button type="button" class="onlp-filter"><svg data-icon="star"></svg>4★ &amp; up</button>
        <div class="onlp-seg" role="radiogroup" aria-label="Sort"><label><input type="radio" name="pp-sort" checked>Popular</label><label><input type="radio" name="pp-sort">Newest</label><label><input type="radio" name="pp-sort">Price</label></div>
      </div>
    </div>
    <div class="onlp-products">
      <article class="onlp-card onlp-product">
        <div class="onlp-product__media" style="--hue:205"><svg data-icon="headphones"></svg><span class="onlp-badge onlp-badge--danger">−25%</span><button type="button" class="onlp-fav" aria-pressed="true" aria-label="Remove from wishlist"><svg data-icon="heart"></svg></button></div>
        <div class="onlp-product__body">
          <div class="onlp-row onlp-row--between"><span class="onlp-sub onlp-xs">Audio</span><span class="onlp-row" style="--onlp-gap:4px;font-size:12px"><span class="onlp-stars" style="font-size:12px;letter-spacing:0">★</span>4.8 <span class="onlp-muted">(1.2k)</span></span></div>
          <h3>Studio wireless headphones</h3>
          <div class="onlp-colors" aria-label="3 colours"><i style="--_c:#1f2937" data-on></i><i style="--_c:#e5e7eb"></i><i style="--_c:#93c5fd"></i></div>
          <div class="onlp-price">₹4,499 <del>₹5,999</del></div>
          <button type="button" class="onlp-btn onlp-btn--dark onlp-btn--sm"><svg data-icon="shopping-cart"></svg>Add to cart</button>
        </div>
      </article>
      <article class="onlp-card onlp-product">
        <div class="onlp-product__media" style="--hue:28"><svg data-icon="coffee"></svg><span class="onlp-badge onlp-badge--gradient">Bestseller</span><button type="button" class="onlp-fav" aria-pressed="false" aria-label="Add to wishlist"><svg data-icon="heart"></svg></button></div>
        <div class="onlp-product__body">
          <div class="onlp-row onlp-row--between"><span class="onlp-sub onlp-xs">Kitchen</span><span class="onlp-row" style="--onlp-gap:4px;font-size:12px"><span class="onlp-stars" style="font-size:12px;letter-spacing:0">★</span>4.9 <span class="onlp-muted">(860)</span></span></div>
          <h3>Ceramic mug set of 2</h3>
          <div class="onlp-colors" aria-label="2 colours"><i style="--_c:#e7d7c1" data-on></i><i style="--_c:#334155"></i></div>
          <div class="onlp-price">₹599</div>
          <button type="button" class="onlp-btn onlp-btn--dark onlp-btn--sm"><svg data-icon="shopping-cart"></svg>Add to cart</button>
        </div>
      </article>
      <article class="onlp-card onlp-product">
        <div class="onlp-product__media" style="--hue:140"><svg data-icon="leaf"></svg><button type="button" class="onlp-fav" aria-pressed="false" aria-label="Add to wishlist"><svg data-icon="heart"></svg></button></div>
        <div class="onlp-product__body">
          <div class="onlp-row onlp-row--between"><span class="onlp-sub onlp-xs">Decor</span><span class="onlp-row" style="--onlp-gap:4px;font-size:12px"><span class="onlp-stars" style="font-size:12px;letter-spacing:0">★</span>4.6 <span class="onlp-muted">(312)</span></span></div>
          <h3>Self-watering desk planter</h3>
          <div class="onlp-colors" aria-label="3 colours"><i style="--_c:#4d7c5a" data-on></i><i style="--_c:#f5f5f4"></i><i style="--_c:#c2410c"></i></div>
          <div class="onlp-price">₹649 <del>₹799</del></div>
          <button type="button" class="onlp-btn onlp-btn--soft onlp-btn--sm"><svg data-icon="check"></svg>In cart</button>
        </div>
      </article>
      <article class="onlp-card onlp-product">
        <div class="onlp-product__media" style="--hue:265"><svg data-icon="lamp"></svg><span class="onlp-badge">Only 3 left</span><button type="button" class="onlp-fav" aria-pressed="false" aria-label="Add to wishlist"><svg data-icon="heart"></svg></button></div>
        <div class="onlp-product__body">
          <div class="onlp-row onlp-row--between"><span class="onlp-sub onlp-xs">Lighting</span><span class="onlp-row" style="--onlp-gap:4px;font-size:12px"><span class="onlp-stars" style="font-size:12px;letter-spacing:0">★</span>4.7 <span class="onlp-muted">(540)</span></span></div>
          <h3>Arc reading lamp</h3>
          <div class="onlp-colors" aria-label="2 colours"><i style="--_c:#111827" data-on></i><i style="--_c:#d4af37"></i></div>
          <div class="onlp-price">₹2,850</div>
          <button type="button" class="onlp-btn onlp-btn--dark onlp-btn--sm"><svg data-icon="shopping-cart"></svg>Add to cart</button>
        </div>
      </article>
    </div>
  </div>
</div>
