<div class="onlp-stage">
  <div class="onlp-grid onlp-max" style="--onlp-min:300px;--onlp-max:860px;align-items:start">
    <div class="onlp-stack">
      <div class="onlp-field">
        <span class="onlp-label">Assign to</span>
        <button type="button" class="onlp-input" style="display:flex;align-items:center;gap:10px;text-align:start;cursor:pointer;border-color:var(--onl-brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--onl-brand) 14%,transparent)"><span class="onlp-av onlp-av--sm" style="--hue:12;--s:24px">RS</span><span class="onlp-grow">Riya Shah</span><svg data-icon="chevrons-up-down" style="width:16px;height:16px;color:var(--onl-muted-2)"></svg></button>
      </div>
      <div class="onlp-listbox" role="listbox" aria-label="People">
        <div class="onlp-listbox__search"><svg data-icon="search"></svg><input placeholder="Search people or teams…" aria-label="Search"></div>
        <div class="onlp-listbox__group">Recent</div>
        <div class="onlp-option" role="option" aria-selected="true"><span class="onlp-av onlp-av--sm" style="--hue:12" data-presence="online">RS</span><div><b>Riya Shah</b><small>Design · online</small></div></div>
        <div class="onlp-option" role="option"><span class="onlp-av onlp-av--sm" style="--hue:210" data-presence="away">VK</span><div><b>Vikram Kumar</b><small>Engineering · away</small></div></div>
        <div class="onlp-listbox__group">Teams</div>
        <div class="onlp-option" role="option"><span class="onlp-tile onlp-tile--sm"><svg data-icon="users"></svg></span><div><b>Support</b><small>8 members</small></div></div>
        <div class="onlp-option" role="option"><span class="onlp-tile onlp-tile--sm"><svg data-icon="briefcase"></svg></span><div><b>Sales</b><small>5 members</small></div></div>
      </div>
    </div>
    <div class="onlp-stack" style="--onlp-gap:18px">
      <div class="onlp-field">
        <span class="onlp-label">Skills <span>3 of 8</span></span>
        <div class="onlp-chipset">
          <span class="onlp-chip"><span class="onlp-av" style="--s:18px;--hue:200;font-size:8px">F</span>Figma<button type="button" aria-label="Remove Figma">×</button></span>
          <span class="onlp-chip"><span class="onlp-av" style="--s:18px;--hue:40;font-size:8px">R</span>React<button type="button" aria-label="Remove React">×</button></span>
          <span class="onlp-chip"><span class="onlp-av" style="--s:18px;--hue:130;font-size:8px">N</span>Node.js<button type="button" aria-label="Remove Node.js">×</button></span>
          <input style="flex:1;min-width:80px;border:0;background:none;font:inherit;font-size:14px;outline:none;color:var(--onl-fg)" placeholder="Add skill…" aria-label="Add skill">
        </div>
      </div>
      <div class="onlp-field">
        <span class="onlp-label">Status</span>
        <div class="onlp-listbox" role="listbox" aria-label="Status">
          <div class="onlp-option" role="option"><span class="onlp-status onlp-status--info"></span>Planned</div>
          <div class="onlp-option" role="option" aria-selected="true"><span class="onlp-status onlp-status--warn"></span>In progress</div>
          <div class="onlp-option" role="option"><span class="onlp-status onlp-status--live"></span>Done</div>
          <div class="onlp-option" role="option"><span class="onlp-status onlp-status--down"></span>Blocked</div>
        </div>
      </div>
    </div>
  </div>
</div>
