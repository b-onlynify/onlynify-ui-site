<div class="onlp-stage">
  <div class="onlp-card onlp-max" style="--onlp-max:760px">
    <div class="onlp-card__head"><div><h3 class="onlp-title" style="font-size:17px">Workspace settings</h3><p class="onlp-sub">Changes apply to everyone in Sunrise Traders.</p></div>
      <div class="onlp-seg" role="radiogroup" aria-label="View">
        <label><input type="radio" name="pro-view" checked><svg data-icon="list"></svg>List</label>
        <label><input type="radio" name="pro-view"><svg data-icon="grid"></svg>Grid</label>
        <label><input type="radio" name="pro-view"><svg data-icon="kanban"></svg>Board</label>
      </div>
    </div>
    <div class="onlp-card__body">
      <div class="onlp-setting"><span class="onlp-tile"><svg data-icon="bell"></svg></span><label class="onlp-setting__text" for="st-1"><b>Email notifications</b><small>Daily digest of orders, payments and mentions</small></label><input type="checkbox" class="onlp-toggle" id="st-1" role="switch" checked></div>
      <div class="onlp-setting"><span class="onlp-tile onlp-tile--success"><svg data-icon="message-circle"></svg></span><label class="onlp-setting__text" for="st-2"><b>Chat receipts</b><small>Send payment receipts on chat</small></label><input type="checkbox" class="onlp-toggle" id="st-2" role="switch" checked></div>
      <div class="onlp-setting"><span class="onlp-tile onlp-tile--warning"><svg data-icon="shield"></svg></span><label class="onlp-setting__text" for="st-3"><b>Two-step sign-in</b><small>Require a one-time code for every admin</small></label><input type="checkbox" class="onlp-toggle" id="st-3" role="switch"></div>
      <div class="onlp-setting" style="flex-wrap:wrap"><span class="onlp-tile onlp-tile--danger"><svg data-icon="languages"></svg></span><div class="onlp-setting__text"><b>Languages</b><small>Customers can switch, including right-to-left scripts</small></div>
        <div class="onlp-row" style="--onlp-gap:14px">
          <label class="onlp-row" style="--onlp-gap:6px;font-size:14px"><input type="checkbox" class="onlp-check" checked> English</label>
          <label class="onlp-row" style="--onlp-gap:6px;font-size:14px"><input type="checkbox" class="onlp-check" checked> हिन्दी</label>
          <label class="onlp-row" style="--onlp-gap:6px;font-size:14px"><input type="checkbox" class="onlp-check"> العربية</label>
        </div>
      </div>
      <p class="onlp-kicker" style="margin:20px 0 10px">Plan</p>
      <div class="onlp-plans" role="radiogroup" aria-label="Plan">
        <label class="onlp-plan"><input type="radio" name="pro-plan"><b>Starter</b><small>Up to 3 users</small><span class="onlp-plan__price">₹0 <small>/mo</small></span></label>
        <label class="onlp-plan"><input type="radio" name="pro-plan" checked><b>Growth</b><small>Up to 25 users · reports</small><span class="onlp-plan__price">₹1,499 <small>/mo</small></span></label>
        <label class="onlp-plan"><input type="radio" name="pro-plan"><b>Scale</b><small>Unlimited · SSO · audit</small><span class="onlp-plan__price">₹4,999 <small>/mo</small></span></label>
      </div>
    </div>
    <div class="onlp-card__foot"><span class="onlp-sub onlp-xs">You have unsaved changes</span><div class="onlp-row" style="--onlp-gap:8px"><button type="button" class="onlp-btn onlp-btn--outline onlp-btn--sm">Reset</button><button type="button" class="onlp-btn onlp-btn--gradient onlp-btn--sm">Save</button></div></div>
  </div>
</div>
