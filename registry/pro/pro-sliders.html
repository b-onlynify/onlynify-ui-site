<div class="onlp-stage">
  <div class="onlp-grid onlp-max" style="--onlp-min:280px;--onlp-max:960px">
    <div class="onlp-card onlp-card--pad onlp-stack" style="--onlp-gap:18px">
      <div class="onlp-row onlp-row--between"><span class="onlp-label">Monthly budget</span><b class="onlp-num" style="font-size:20px">₹45,000</b></div>
      <input type="range" class="onlp-range" min="5000" max="100000" step="5000" value="45000" style="--p:42%" aria-label="Monthly budget">
      <div class="onlp-row onlp-row--between onlp-sub onlp-xs"><span>₹5k</span><span>₹50k</span><span>₹1L</span></div>
      <div class="onlp-divider"></div>
      <span class="onlp-label">Price range</span>
      <div class="onlp-row" style="--onlp-gap:8px">
        <div class="onlp-addon onlp-grow"><span>Min</span><input class="onlp-input" value="₹1,200" aria-label="Minimum price"></div>
        <span class="onlp-sub">–</span>
        <div class="onlp-addon onlp-grow"><span>Max</span><input class="onlp-input" value="₹8,500" aria-label="Maximum price"></div>
      </div>
    </div>
    <div class="onlp-card onlp-card--pad onlp-stack" style="--onlp-gap:18px">
      <div><h3 class="onlp-title">How was your delivery?</h3><p class="onlp-sub">Order #20461 · delivered today</p></div>
      <div class="onlp-emoji" role="radiogroup" aria-label="Rating">
        <label title="Terrible"><input type="radio" name="pro-mood">😣</label>
        <label title="Bad"><input type="radio" name="pro-mood">🙁</label>
        <label title="Okay"><input type="radio" name="pro-mood">😐</label>
        <label title="Good"><input type="radio" name="pro-mood" checked>🙂</label>
        <label title="Great"><input type="radio" name="pro-mood">🤩</label>
      </div>
      <div class="onlp-row" style="--onlp-gap:10px"><span class="onlp-stars" style="font-size:20px">★★★★☆</span><b>4.0</b><span class="onlp-sub">from 1,284 reviews</span></div>
    </div>
    <div class="onlp-card onlp-card--pad onlp-stack" style="--onlp-gap:14px">
      <span class="onlp-label">Accent colour</span>
      <div class="onlp-swatches" role="radiogroup" aria-label="Accent colour">
        <label style="--c:#1449a0" title="Ocean"><input type="radio" name="pro-sw" checked></label>
        <label style="--c:#6d28d9" title="Violet"><input type="radio" name="pro-sw"></label>
        <label style="--c:#be123c" title="Rose"><input type="radio" name="pro-sw"></label>
        <label style="--c:#047857" title="Emerald"><input type="radio" name="pro-sw"></label>
        <label style="--c:#c2410c" title="Orange"><input type="radio" name="pro-sw"></label>
        <label style="--c:#0f172a" title="Ink"><input type="radio" name="pro-sw"></label>
      </div>
      <span class="onlp-label">Corner radius</span>
      <div class="onlp-seg" role="radiogroup" aria-label="Corner radius"><label><input type="radio" name="pro-rad">Sharp</label><label><input type="radio" name="pro-rad" checked>Soft</label><label><input type="radio" name="pro-rad">Round</label></div>
    </div>
  </div>
</div>
