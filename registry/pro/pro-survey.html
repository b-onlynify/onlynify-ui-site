<div class="onlp-stage onlp-stage--center onlp-stage--mesh">
  <form class="onlp-card onlp-survey">
    <div class="onlp-card__body onlp-stack" style="--onlp-gap:22px;padding:28px">
      <ol class="onlp-hsteps" aria-label="Survey progress"><li data-state="done"><span></span><b>About you</b></li><li aria-current="step"><span></span><b>Experience</b></li><li><span></span><b>Finish</b></li></ol>
      <fieldset style="border:0;padding:0;margin:0" class="onlp-stack">
        <legend class="onlp-title" style="font-size:18px;margin-bottom:12px">How likely are you to recommend us to a friend?</legend>
        <div class="onlp-scale">
          <label><input type="radio" name="sv-nps">0</label><label><input type="radio" name="sv-nps">1</label><label><input type="radio" name="sv-nps">2</label><label><input type="radio" name="sv-nps">3</label><label><input type="radio" name="sv-nps">4</label><label><input type="radio" name="sv-nps">5</label><label><input type="radio" name="sv-nps">6</label><label><input type="radio" name="sv-nps">7</label><label><input type="radio" name="sv-nps">8</label><label><input type="radio" name="sv-nps" checked>9</label><label><input type="radio" name="sv-nps">10</label>
        </div>
        <div class="onlp-row onlp-row--between onlp-sub onlp-xs"><span>Not likely</span><span>Very likely</span></div>
      </fieldset>
      <fieldset style="border:0;padding:0;margin:0" class="onlp-stack">
        <legend class="onlp-title" style="margin-bottom:10px">How do you feel about setup?</legend>
        <div class="onlp-emoji" role="radiogroup"><label><input type="radio" name="sv-m">😣</label><label><input type="radio" name="sv-m">🙁</label><label><input type="radio" name="sv-m">😐</label><label><input type="radio" name="sv-m" checked>🙂</label><label><input type="radio" name="sv-m">🤩</label></div>
      </fieldset>
      <div class="onlp-field"><label class="onlp-label" for="sv-more">What should we improve? <span>Optional</span></label><textarea class="onlp-input" id="sv-more" placeholder="Tell us in your own words…"></textarea></div>
    </div>
    <div class="onlp-card__foot"><button type="button" class="onlp-btn onlp-btn--outline onlp-btn--sm"><svg data-icon="arrow-left"></svg>Back</button><button type="button" class="onlp-btn onlp-btn--gradient onlp-btn--sm">Continue<svg data-icon="arrow-right"></svg></button></div>
  </form>
</div>
