<div class="onlp-stage onlp-stage--center">
  <div class="onlp-card onlp-max" style="--onlp-max:620px">
    <div class="onlp-card__head"><div><h3 class="onlp-title" style="font-size:17px">Upload documents</h3><p class="onlp-sub">PDF, images or spreadsheets up to 25 MB each.</p></div><button type="button" class="onlp-x" aria-label="Close"><svg data-icon="x"></svg></button></div>
    <div class="onlp-card__body onlp-stack" style="--onlp-gap:12px">
      <label class="onlp-drop" data-onl-dropzone>
        <span class="onlp-tile onlp-tile--solid"><svg data-icon="cloud-upload"></svg></span>
        <b style="font-size:14px">Drop files here or <span style="color:var(--onl-brand)">browse</span></b>
        <span class="onlp-sub onlp-xs">Up to 10 files at once</span>
        <input type="file" multiple hidden>
      </label>
      <div class="onlp-file">
        <span class="onlp-file__type" style="--_c:#e5484d">pdf</span>
        <div class="onlp-grow"><b style="font-size:14px">Brand-guidelines-2026.pdf</b><div class="onlp-file__meta"><span>2.4 MB of 3.8 MB</span><span>64% · 6 s left</span></div><div class="onlp-bar" style="height:6px"><i style="--v:64%"></i></div></div>
        <button type="button" class="onlp-x" aria-label="Cancel upload"><svg data-icon="x"></svg></button>
      </div>
      <div class="onlp-file">
        <span class="onlp-file__type" style="--_c:#16a34a">xls</span>
        <div class="onlp-grow"><b style="font-size:14px">Q3-sales-report.xlsx</b><div class="onlp-file__meta" style="margin-bottom:0"><span>840 KB</span><span class="onlp-hint onlp-hint--ok"><svg data-icon="check-circle"></svg>Uploaded</span></div></div>
        <button type="button" class="onlp-x" aria-label="Delete file"><svg data-icon="trash"></svg></button>
      </div>
      <div class="onlp-file" data-state="error">
        <span class="onlp-file__type" style="--_c:#7c3aed">img</span>
        <div class="onlp-grow"><b style="font-size:14px">Team-offsite.heic</b><div class="onlp-file__meta" style="margin-bottom:0"><span>31.2 MB</span><span class="onlp-hint onlp-hint--error"><svg data-icon="alert-circle"></svg>Larger than 25 MB</span></div></div>
        <button type="button" class="onlp-btn onlp-btn--outline onlp-btn--sm"><svg data-icon="refresh"></svg>Retry</button>
      </div>
    </div>
    <div class="onlp-card__foot"><span class="onlp-sub onlp-xs">2 of 3 ready</span><div class="onlp-row" style="--onlp-gap:8px"><button type="button" class="onlp-btn onlp-btn--outline onlp-btn--sm">Cancel</button><button type="button" class="onlp-btn onlp-btn--gradient onlp-btn--sm">Attach 2 files</button></div></div>
  </div>
</div>
